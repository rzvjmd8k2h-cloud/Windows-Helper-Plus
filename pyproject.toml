[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "windows-helper-plus"
version = "0.2.0"
description = "AI-driven Windows diagnostic, interactive triage and confirmed repair assistant"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["PySide6-Essentials>=6.12.0,<7"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.gui-scripts]
windows-helper-plus = "helper_plus.ui.app:main"

[tool.setuptools.packages.find]
include = ["helper_plus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
