name: ci-debug

on:
  push:

permissions:
  contents: write

jobs:
  capture:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run tests and capture output
        run: |
          python -m pytest -q --tb=long 2>&1 | Tee-Object -FilePath ci-test.log
          "pytest_exit_code=$LASTEXITCODE" | Out-File -Append -Encoding utf8 ci-test.log
      - name: Publish log to branch
        if: always()
        run: |
          git config user.name "ci-debug"
          git config user.email "ci-debug@users.noreply.github.com"
          git checkout -B ci-log
          git add -f ci-test.log
          git commit -m "ci failure log"
          git push -f origin ci-log
